<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>수업 자료실</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f7f5f0;color:#23211c;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
a{color:oklch(.5 .13 58)}
a:hover{color:oklch(.42 .13 58)}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer}
#목차{max-width:560px;margin:0 auto;padding:22px 16px calc(96px + env(safe-area-inset-bottom))}
.머리{padding:6px 4px 18px}
.수업명{font:800 27px/1.25 'Nanum Myeongjo',serif}
.선생{font:400 13px/1 'Noto Sans KR';color:#8b8578;margin-top:9px}
.공지{background:oklch(.96 .03 78);border:1px solid oklch(.86 .06 74);border-radius:14px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start;margin-bottom:16px}
.공지 i{width:7px;height:7px;border-radius:50%;background:oklch(.58 .13 58);flex:none;margin-top:7px}
.공지 b{display:block;font:500 10.5px/1 'Noto Sans KR';color:oklch(.5 .1 58);letter-spacing:.06em}
.공지 p{margin:5px 0 0;font:500 14px/1.6 'Noto Sans KR'}
.대{border-bottom:1px solid #eae5da}
.대줄{width:100%;display:flex;align-items:baseline;gap:13px;padding:16px 4px;text-align:left}
.대번호{font:700 15px/1 'Nanum Myeongjo',serif;color:#b8b1a2;flex:none;min-width:24px}
.대제목{font:400 16px/1.35 'Noto Sans KR';flex:1}
.개수{font:400 12px/1 'Noto Sans KR';color:#a8a294;flex:none}
.대.열림{background:#fffefb;border:1px solid #e6e1d6;border-radius:16px;margin:10px 0;overflow:hidden}
.대.열림 .대줄{background:#23211c;color:#f7f5f0;padding:16px 16px}
.대.열림 .대번호{color:rgba(247,245,240,.55)}
.대.열림 .개수{color:rgba(247,245,240,.55)}
.속{padding:14px 16px 18px;display:flex;flex-direction:column;gap:18px}
.중제목{display:flex;align-items:baseline;gap:10px;font:500 14.5px/1.35 'Noto Sans KR'}
.중번호{font:700 12.5px/1 'Nanum Myeongjo',serif;color:#b8b1a2;flex:none}
.소{padding-left:12px;border-left:2px solid #f0ece3;margin-top:11px;display:flex;flex-direction:column;gap:11px}
.소제목{font:400 12.5px/1.4 'Noto Sans KR';color:#8b8578}
.차시{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.차시제목{font:500 14px/1.4 'Noto Sans KR';color:#23211c}
.미리{position:relative;border:1px solid #e6e1d6;border-radius:11px;overflow:hidden;background:#fffefb;height:158px;width:100%;padding:0;display:block}
.미리 canvas{width:100%;display:block}
.미리 span{position:absolute;left:0;right:0;bottom:0;padding:9px 11px;background:linear-gradient(rgba(35,33,28,0),rgba(35,33,28,.85));color:#f7f5f0;font:500 11px/1 'Noto Sans KR';text-align:right}
.자료{display:flex;align-items:center;gap:11px}
.도형{width:20px;height:25px;border:1.5px solid #57534a;border-radius:3px;flex:none}
.자료 .이름{flex:1;min-width:0}
.자료 .이름 b{display:block;font:400 13.5px/1.4 'Noto Sans KR';font-weight:400}
.자료 .이름 i{display:block;font:400 11.5px/1 'Noto Sans KR';color:#8b8578;font-style:normal;margin-top:4px}
.버튼{flex:none;font:500 11.5px/1 'Noto Sans KR';border-radius:20px;padding:9px 13px;white-space:nowrap}
.받기{background:oklch(.58 .13 58);color:#fffefb}
.중{background:transparent;border:1px solid #e6e1d6;color:#8b8578}
.열기{border:1.5px solid #23211c;color:#23211c;display:flex;align-items:center;gap:6px}
.열기 em{width:5px;height:5px;border-radius:50%;background:oklch(.55 .11 152);display:block}
.빈{font:400 12.5px/1.6 'Noto Sans KR';color:#c6bfae;padding:20px 4px;text-align:center}
/* 펼치기·접기 */
.접기{width:100%;text-align:left;display:flex;align-items:center;gap:9px;padding:7px 0}
.화살{flex:none;font-size:10px;line-height:1;color:#b8b1a2;transform:rotate(-90deg);transition:transform .18s}
.화살.펼침{transform:rotate(0)}
.꼬리{margin-left:auto;flex:none;font:400 11.5px/1 'Noto Sans KR';color:#a8a294;padding-left:10px}
.중속{display:flex;flex-direction:column}
.소속{display:flex;flex-direction:column;gap:11px;padding-left:8px}
.차시속{display:flex;flex-direction:column;gap:10px;padding:2px 0 6px}
.접힘{display:none}
/* 새 공지 표시 */
.새{display:inline-block;background:oklch(.58 .13 58);color:#fffefb;font:500 9.5px/1 'Noto Sans KR';letter-spacing:.05em;padding:4px 6px;border-radius:6px;margin-left:7px;vertical-align:1px}
.공지줄{display:flex;align-items:flex-start;gap:6px}
.확인{font:500 11px/1 'Noto Sans KR';color:oklch(.5 .1 58);border:1px solid oklch(.86 .06 74);border-radius:16px;padding:7px 12px;margin-top:11px}
/* 아래 메뉴바 */
.탭바{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fffefb;border-top:1px solid #e0dbd0;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.탭{flex:1;padding:9px 4px 11px;text-align:center;color:#a8a294;font:400 11px/1.1 'Noto Sans KR'}
.탭 b{display:block;font:400 17px/1 'Noto Sans KR';margin-bottom:6px}
.탭.on{color:oklch(.58 .13 58)}
.탭.on b{font-weight:500}
.탭 .점{display:inline-block;width:6px;height:6px;border-radius:50%;background:oklch(.58 .13 58);margin-left:4px;vertical-align:2px}
body.뷰중 .탭바{display:none}
/* 내 필기 화면 */
.쪽머리{font:400 12.5px/1.5 'Noto Sans KR';color:#8b8578;padding:2px 4px 16px}
.필기줄{display:flex;align-items:center;gap:11px;background:#fffefb;border:1px solid #e6e1d6;border-radius:12px;padding:13px 14px;margin-bottom:10px}
.필기줄 .글{flex:1;min-width:0;text-align:left}
.필기줄 .글 b{display:block;font:400 13.5px/1.4 'Noto Sans KR'}
.필기줄 .글 i{display:block;font:400 11.5px/1.4 'Noto Sans KR';color:#8b8578;font-style:normal;margin-top:4px}
.지움{flex:none;font:400 16px/1 'Noto Sans KR';color:#c6bfae;padding:6px 4px}
/* 뷰어 */
#뷰어{position:fixed;inset:0;background:#3a372f;display:none;flex-direction:column;z-index:20}
#뷰어.on{display:flex}
.뷰머리{background:#23211c;color:#f7f5f0;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;display:flex;align-items:center;gap:11px;flex:none}
.뒤로{font:400 21px/.7 'Noto Sans KR';opacity:.85;padding:4px 2px}
.뷰제목{flex:1;min-width:0}
.뷰제목 b{display:block;font:500 14px/1.25 'Noto Sans KR';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.뷰제목 i{display:block;font:400 10.5px/1 'Noto Sans KR';opacity:.6;font-style:normal;margin-top:5px}
.필기토글{flex:none;font:500 10.5px/1 'Noto Sans KR';border:1px solid rgba(247,245,240,.35);border-radius:20px;padding:8px 10px}
.필기토글.켬{background:#f7f5f0;color:#23211c;border-color:#f7f5f0}
#지면{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;justify-content:center}
#지면.잠금{overflow:hidden}
#싸개{position:relative;background:#fffefb;box-shadow:0 4px 16px rgba(0,0,0,.32);align-self:flex-start}
#지면canvas,#필기canvas{display:block}
#필기canvas{position:absolute;inset:0;touch-action:none}
.도구{background:#fffefb;padding:11px 12px calc(15px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex:none;border-top:1px solid #e6e1d6}
.도구 button{width:42px;height:42px;border-radius:12px;border:1.5px solid #e6e1d6;display:flex;align-items:center;justify-content:center;font:500 11px/1 'Noto Sans KR';color:#57534a}
.도구 button.on{background:#23211c;border-color:#23211c;color:#f7f5f0}
.쪽{margin-left:auto;display:flex;align-items:center;gap:9px;font:500 12px/1 'Noto Sans KR';color:#57534a}
.쪽 button{width:36px;height:36px;border-radius:10px}
.쪽 button:disabled{opacity:.3}
#로딩{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 13px/1 'Noto Sans KR';color:#dcd6c8}
.안내{font:400 12px/1.8 'Noto Sans KR';color:#8b8578;text-align:center;padding:26px 10px 0;border-top:1px solid #eae5da;margin-top:22px}
/* 태블릿 — 화면이 넓어지면 본문 폭과 글자를 함께 키웁니다 */
@media (min-width:760px){
  #목차{max-width:780px;padding:34px 26px calc(44px + env(safe-area-inset-bottom))}
  .수업명{font-size:35px}
  .선생{font-size:15px}
  .공지{padding:18px 20px;border-radius:16px}
  .공지 p{font-size:16.5px}
  .대줄{padding:20px 6px}
  .대번호{font-size:18px;min-width:30px}
  .대제목{font-size:20px}
  .개수{font-size:14px}
  .속{padding:18px 20px 24px;gap:22px}
  .중제목{font-size:17.5px}
  .중번호{font-size:15px}
  .소제목{font-size:14.5px}
  .차시제목{font-size:17px}
  .미리{height:250px}
  .미리 span{font-size:13px;padding:11px 14px}
  .자료{gap:14px}
  .도형{width:24px;height:30px}
  .자료 .이름 b{font-size:16px}
  .자료 .이름 i{font-size:13px}
  .버튼{font-size:13.5px;padding:12px 18px}
  .안내{font-size:14px}
  .필기줄 .글 b{font-size:16px}
  .필기줄 .글 i{font-size:13px}
  .쪽머리{font-size:14.5px}
  .탭{font-size:13px;padding:11px 4px 13px}
  .탭 b{font-size:20px}
  .뷰제목 b{font-size:17px}
  .뷰제목 i{font-size:12.5px}
  .필기토글{font-size:13px;padding:11px 15px}
  .도구 button{width:52px;height:52px;font-size:13px}
  .쪽{font-size:14px}
  .쪽 button{width:44px;height:44px}
}
</style>
</head>
<body>

<div id="목차">
  <div class="머리">
    <div class="수업명" id="수업명"></div>
    <div class="선생" id="선생"></div>
  </div>
  <div id="공지자리"></div>
  <div id="단원자리"></div>
  <div id="필기화면" class="접힘">
    <div class="쪽머리">필기한 자료만 모아 둔 곳입니다. 눌러서 이어 보세요.</div>
    <div id="필기자리"></div>
  </div>
  <div class="안내">필기는 이 기기에만 저장됩니다.<br>중요한 내용은 사진으로도 남겨두세요.</div>
</div>

<div class="탭바">
  <button class="탭 on" data-화면="수업"><b>▤</b>수업</button>
  <button class="탭" data-화면="필기"><b>✎</b>내 필기</button>
</div>

<div id="뷰어">
  <div class="뷰머리">
    <button class="뒤로" id="닫기">‹</button>
    <div class="뷰제목"><b id="뷰제목"></b><i id="뷰상태">읽기 중 · 넘겨서 보기</i></div>
    <button class="필기토글" id="필기토글">필기 끔</button>
  </div>
  <div id="지면"><div id="싸개"><canvas id="지면canvas"></canvas><canvas id="필기canvas"></canvas></div><div id="로딩">불러오는 중…</div></div>
  <div class="도구">
    <button data-도구="펜" class="on">펜</button>
    <button data-도구="형광">형광</button>
    <button data-도구="지우개">지우개</button>
    <button id="되돌리기">↺</button>
    <div class="쪽"><button id="이전">‹</button><span id="쪽수">1 / 1</span><button id="다음">›</button></div>
  </div>
</div>

<script src="자료목록.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const 받은파일 = new Map();
const $ = s => document.querySelector(s);
const 보임 = x => x.공개 !== false;
/* 차시 단계가 없는 예전 구조도 그대로 읽습니다 */
const 차시목록 = 소 => 소.차시 && 소.차시.length ? 소.차시 : (소.자료 && 소.자료.length ? [{ 자료: 소.자료 }] : []);
/* 파일경로 → 자료 정보. '내 필기' 화면에서 제목을 찾을 때 씁니다 */
const 자료색인 = new Map();

/* ── 목차 그리기 ── */
document.title = 수업자료.수업이름 + ' 자료실';
$('#수업명').textContent = 수업자료.수업이름;
$('#선생').textContent = 수업자료.선생님;

/* ── 공지 (새 공지에는 NEW 표시) ── */
const 공지들 = (Array.isArray(수업자료.공지) ? 수업자료.공지 : [수업자료.공지])
  .filter(g => typeof g === 'string' && g.trim());

function 본공지() {
  try { return JSON.parse(localStorage.getItem('본공지') || '[]'); }
  catch (e) { return []; }
}
const 새공지 = () => 공지들.filter(g => !본공지().includes(g));

function 공지그리기() {
  const 칸 = $('#공지자리');
  칸.innerHTML = '';
  if (!공지들.length) return;
  const 본 = 본공지();
  const 새것 = 공지들.filter(g => !본.includes(g));

  const box = document.createElement('div');
  box.className = '공지';
  const 점 = document.createElement('i');
  const 속 = document.createElement('div');
  속.style.flex = '1';
  const 이름 = document.createElement('b');
  이름.textContent = '공지';
  속.appendChild(이름);

  공지들.forEach(g => {
    const 줄 = document.createElement('div');
    줄.className = '공지줄';
    const p = document.createElement('p');
    p.textContent = g;
    줄.appendChild(p);
    if (!본.includes(g)) {
      const 뱃 = document.createElement('span');
      뱃.className = '새';
      뱃.textContent = 'NEW';
      p.appendChild(뱃);
    }
    속.appendChild(줄);
  });

  if (새것.length) {
    const 단 = document.createElement('button');
    단.className = '확인';
    단.textContent = '확인했어요';
    단.onclick = () => {
      try { localStorage.setItem('본공지', JSON.stringify(공지들)); } catch (e) {}
      공지그리기();
      탭표시();
    };
    속.appendChild(단);
  }

  box.appendChild(점);
  box.appendChild(속);
  칸.appendChild(box);
}
공지그리기();

const 자리 = $('#단원자리');
const 대단원들 = (수업자료.단원 || []).filter(보임);

if (!대단원들.length) {
  자리.innerHTML = '<div class="빈">아직 공개된 단원이 없습니다.</div>';
}

/* ── 펼치기·접기 도우미 ── */
function 화살만들기() {
  const s = document.createElement('span');
  s.className = '화살';
  s.textContent = '▾';
  return s;
}

/* 단추를 누르면 속칸이 열리고 닫힙니다. 처음열림=처음 화면에서 펼쳐둘지 */
function 접기연결(단추, 속, 처음열림, 열때할일) {
  const 살 = 단추.querySelector('.화살');
  let 열림 = !!처음열림;
  const 그리기 = () => {
    속.classList.toggle('접힘', !열림);
    살.classList.toggle('펼침', 열림);
    if (열림 && 열때할일) 열때할일();
  };
  그리기();
  단추.onclick = () => { 열림 = !열림; 그리기(); };
}

const 자료수 = 차 => (차.자료 || []).length;
const 소자료수 = 소 => 차시목록(소).filter(보임).reduce((n, 차) => n + 자료수(차), 0);
const 중자료수 = 중 => (중.소단원 || []).filter(보임).reduce((n, 소) => n + 소자료수(소), 0);

function 준비중(글 = '자료 준비 중') {
  const p = document.createElement('div');
  p.className = '소제목';
  p.style.color = '#c6bfae';
  p.textContent = 글;
  return p;
}

대단원들.forEach((대, i) => {
  const 중들 = (대.중단원 || []).filter(보임);
  const 총 = 중들.reduce((n, 중) => n + 중자료수(중), 0);

  const box = document.createElement('div');
  box.className = '대';
  const 줄 = document.createElement('button');
  줄.className = '대줄';
  줄.innerHTML = '<span class="대번호"></span><span class="대제목"></span><span class="개수"></span>';
  줄.prepend(화살만들기());
  줄.querySelector('.대번호').textContent = 대.번호 || '';
  줄.querySelector('.대제목').textContent = 대.제목 || '';
  줄.querySelector('.개수').textContent = 총 ? '자료 ' + 총 : '준비 중';
  box.appendChild(줄);

  const 속 = document.createElement('div');
  속.className = '속';

  중들.forEach(중 => {
    /* ── 중단원 ── */
    const 중칸 = document.createElement('div');
    const 중단추 = document.createElement('button');
    중단추.className = '중제목 접기';
    중단추.innerHTML = '<span class="중번호"></span><span></span><span class="꼬리"></span>';
    중단추.prepend(화살만들기());
    중단추.querySelector('.중번호').textContent = 중.번호 || '';
    중단추.querySelectorAll('span')[2].textContent = 중.제목 || '';
    const 중수 = 중자료수(중);
    중단추.querySelector('.꼬리').textContent = 중수 ? '자료 ' + 중수 : '준비 중';
    중칸.appendChild(중단추);

    const 중속 = document.createElement('div');
    중속.className = '중속';
    중칸.appendChild(중속);
    접기연결(중단추, 중속, true);

    (중.소단원 || []).filter(보임).forEach(소 => {
      /* ── 소단원 ── */
      const 소칸 = document.createElement('div');
      소칸.className = '소';
      const 소단추 = document.createElement('button');
      소단추.className = '소제목 접기';
      소단추.innerHTML = '<span></span><span class="꼬리"></span>';
      소단추.prepend(화살만들기());
      소단추.querySelectorAll('span')[1].textContent =
        (소.번호 ? 소.번호 + ' ' : '') + (소.제목 || '');
      const 소수 = 소자료수(소);
      소단추.querySelector('.꼬리').textContent = 소수 ? '자료 ' + 소수 : '준비 중';
      소칸.appendChild(소단추);

      const 소속 = document.createElement('div');
      소속.className = '소속';
      소칸.appendChild(소속);
      접기연결(소단추, 소속, true);

      const 차시들 = 차시목록(소).filter(보임);
      if (!차시들.length) 소속.appendChild(준비중());

      차시들.forEach(차 => {
        /* ── 차시 ── */
        const 차칸 = document.createElement('div');
        const 차단추 = document.createElement('button');
        차단추.className = '차시제목 접기';
        차단추.innerHTML = '<span></span><span class="꼬리"></span>';
        차단추.prepend(화살만들기());
        차단추.querySelectorAll('span')[1].textContent =
          (차.번호 ? 차.번호 + ' ' : '') + (차.제목 || '수업 자료');
        const 차수 = 자료수(차);
        차단추.querySelector('.꼬리').textContent = 차수 ? '자료 ' + 차수 : '준비 중';
        차칸.appendChild(차단추);

        const 차시속 = document.createElement('div');
        차시속.className = '차시속';
        차칸.appendChild(차시속);

        const 차이름 = (차.번호 ? 차.번호 + ' ' : '') + (차.제목 || '수업 자료');
        (차.자료 || []).forEach(자 => {
          if (자 && 자.파일) 자료색인.set(자.파일, { 자, 위치: (중.제목 || '') + ' · ' + 차이름 });
        });

        /* 미리보기는 실제로 펼칠 때 한 번만 만듭니다 (처음 화면이 빨라집니다) */
        let 지었나 = false;
        접기연결(차단추, 차시속, false, () => {
          if (지었나) return;
          지었나 = true;
          const 자료들 = 차.자료 || [];
          if (자료들[0]) 차시속.appendChild(미리보기만들기(자료들[0]));
          자료들.forEach(자 => 차시속.appendChild(자료줄만들기(자)));
          if (!자료들.length) 차시속.appendChild(준비중());
        });

        소속.appendChild(차칸);
      });
      중속.appendChild(소칸);
    });
    속.appendChild(중칸);
  });

  box.appendChild(속);
  접기연결(줄, 속, i === 0);
  줄.addEventListener('click', () => box.classList.toggle('열림', !속.classList.contains('접힘')));
  box.classList.toggle('열림', i === 0);
  자리.appendChild(box);
});

/* ── 자료 한 줄 ── */
function 자료줄만들기(자) {
  const el = document.createElement('div');
  el.className = '자료';
  el.innerHTML = '<span class="도형"></span><span class="이름"><b></b><i></i></span>';
  el.querySelector('b').textContent = 자.제목 || '';
  el.querySelector('i').textContent = 자.설명 || 'PDF';

  const 단 = document.createElement('button');
  단.className = '버튼 받기';
  단.textContent = '받기';
  el.appendChild(단);

  단.onclick = async () => {
    if (받은파일.has(자.파일)) return 뷰어열기(자);
    단.className = '버튼 중';
    단.textContent = '받는 중…';
    try {
      const r = await fetch(자.파일);
      if (!r.ok) throw 0;
      받은파일.set(자.파일, await r.arrayBuffer());
      단.className = '버튼 열기';
      단.innerHTML = '<em></em>열기';
      단.onclick = () => 뷰어열기(자);
    } catch (e) {
      단.className = '버튼 중';
      단.textContent = '실패 · 다시';
      단.onclick = () => location.reload();
    }
  };
  return el;
}

/* ── 첫 장 미리보기 ── */
function 미리보기만들기(자) {
  const b = document.createElement('button');
  b.className = '미리';
  b.innerHTML = '<canvas></canvas><span>크게 보기</span>';
  b.onclick = () => 뷰어열기(자);
  pdfjsLib.getDocument(자.파일).promise.then(doc => doc.getPage(1)).then(p => {
    const c = b.querySelector('canvas');
    const v0 = p.getViewport({ scale: 1 });
    const 밀도 = Math.min(window.devicePixelRatio || 1, 2);
    const 폭 = (b.clientWidth || 520) * 밀도;
    const v = p.getViewport({ scale: 폭 / v0.width });
    c.width = Math.round(v.width); c.height = Math.round(v.height);
    p.render({ canvasContext: c.getContext('2d'), viewport: v });
  }).catch(() => b.remove());
  return b;
}

/* ── 뷰어 ── */
let 문서 = null, 쪽 = 1, 총쪽 = 1, 지금파일 = '', 도구 = '펜', 필기중 = false;
let 획들 = [], 그리는중 = null;

const 뷰 = $('#뷰어'), 지면 = $('#지면'), 싸개 = $('#싸개');
const cPdf = $('#지면canvas'), cInk = $('#필기canvas'), gInk = cInk.getContext('2d');

async function 뷰어열기(자, 시작쪽) {
  뷰.classList.add('on');
  document.body.classList.add('뷰중');
  document.body.style.overflow = 'hidden';
  $('#뷰제목').textContent = 자.제목 || '';
  $('#로딩').style.display = 'flex';
  지금파일 = 자.파일; 쪽 = 1;
  const 원본 = 받은파일.get(자.파일);
  문서 = await pdfjsLib.getDocument(원본 ? { data: 원본.slice(0) } : 자.파일).promise;
  총쪽 = 문서.numPages;
  쪽 = Math.min(Math.max(시작쪽 || 1, 1), 총쪽);
  await 쪽그리기();
  $('#로딩').style.display = 'none';
}

async function 쪽그리기() {
  const p = await 문서.getPage(쪽);
  const v0 = p.getViewport({ scale: 1 });

  /* 가로 폭에 맞추되, 가로로 긴 쪽(수업화면)은 화면 높이에도 맞춰 한눈에 들어오게 */
  let 배 = Math.min(지면.clientWidth - 20, 1400) / v0.width;
  if (v0.width > v0.height) {
    배 = Math.min(배, (지면.clientHeight - 20) / v0.height);
  }
  const v = p.getViewport({ scale: 배 });

  /* 화면 밀도만큼 크게 그려야 글씨가 또렷합니다 (레티나 대응) */
  const 밀도 = Math.min(window.devicePixelRatio || 1, 2);
  const vHi = p.getViewport({ scale: 배 * 밀도 });

  [cPdf, cInk].forEach(c => {
    c.width = Math.round(vHi.width);
    c.height = Math.round(vHi.height);
    c.style.width = v.width + 'px';
    c.style.height = v.height + 'px';
  });
  싸개.style.width = v.width + 'px';
  싸개.style.height = v.height + 'px';
  await p.render({ canvasContext: cPdf.getContext('2d'), viewport: vHi }).promise;
  획들 = 불러오기();
  다시칠하기();
  $('#쪽수').textContent = 쪽 + ' / ' + 총쪽;
  $('#이전').disabled = 쪽 <= 1;
  $('#다음').disabled = 쪽 >= 총쪽;
  지면.scrollTop = 0;
}

const 열쇠 = () => '필기:' + 지금파일 + ':' + 쪽;
function 저장하기() { try { localStorage.setItem(열쇠(), JSON.stringify(획들)); } catch (e) {} }
function 불러오기() { try { return JSON.parse(localStorage.getItem(열쇠()) || '[]'); } catch (e) { return []; } }

function 칠하기(획) {
  if (!획.점.length) return;
  gInk.save();
  gInk.lineCap = 'round'; gInk.lineJoin = 'round';
  const 배 = cInk.width / 1000;
  if (획.도구 === '지우개') { gInk.globalCompositeOperation = 'destination-out'; gInk.lineWidth = 26 * 배; }
  else if (획.도구 === '형광') { gInk.strokeStyle = 'rgba(240,190,60,.42)'; gInk.lineWidth = 20 * 배; }
  else { gInk.strokeStyle = '#1b3a6b'; gInk.lineWidth = 3 * 배; }
  gInk.beginPath();
  gInk.moveTo(획.점[0][0] * cInk.width, 획.점[0][1] * cInk.height);
  획.점.forEach(pt => gInk.lineTo(pt[0] * cInk.width, pt[1] * cInk.height));
  gInk.stroke();
  gInk.restore();
}
function 다시칠하기() { gInk.clearRect(0, 0, cInk.width, cInk.height); 획들.forEach(칠하기); }

function 좌표(e) {
  const r = cInk.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
/* 팜 리젝션 — 펜을 한 번이라도 쓰면 그 뒤로는 손가락·손바닥 입력을 무시합니다 */
let 펜쓰는중 = false;
const 무시할입력 = e => {
  if (e.pointerType === 'pen') { 펜쓰는중 = true; return false; }
  return 펜쓰는중;
};

cInk.addEventListener('pointerdown', e => {
  if (!필기중 || 무시할입력(e)) return;
  cInk.setPointerCapture(e.pointerId);
  그리는중 = { 도구, 점: [좌표(e)] };
  획들.push(그리는중);
});
cInk.addEventListener('pointermove', e => {
  if (!그리는중 || 무시할입력(e)) return;
  그리는중.점.push(좌표(e));
  칠하기(그리는중);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(n =>
  cInk.addEventListener(n, () => { if (그리는중) { 그리는중 = null; 저장하기(); } }));

$('#필기토글').onclick = () => {
  필기중 = !필기중;
  const b = $('#필기토글');
  b.classList.toggle('켬', 필기중);
  b.textContent = 필기중 ? '필기 켬' : '필기 끔';
  cInk.style.pointerEvents = 필기중 ? 'auto' : 'none';
  지면.classList.toggle('잠금', 필기중);
  $('#뷰상태').textContent = 필기중 ? '필기 중 · 이 기기에 저장됩니다' : '읽기 중 · 넘겨서 보기';
};
cInk.style.pointerEvents = 'none';

document.querySelectorAll('[data-도구]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-도구]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  도구 = b.dataset.도구;
  if (!필기중) $('#필기토글').onclick();
});
$('#되돌리기').onclick = () => { 획들.pop(); 다시칠하기(); 저장하기(); };
$('#이전').onclick = () => { if (쪽 > 1) { 쪽--; 쪽그리기(); } };
$('#다음').onclick = () => { if (쪽 < 총쪽) { 쪽++; 쪽그리기(); } };
$('#닫기').onclick = () => {
  뷰.classList.remove('on');
  document.body.classList.remove('뷰중');
  document.body.style.overflow = '';
  if (지금화면 === '필기') 필기그리기();
  탭표시();
};

let 늦게;
const 다시그리기예약 = () => { clearTimeout(늦게); if (문서) 늦게 = setTimeout(쪽그리기, 250); };
addEventListener('resize', 다시그리기예약);
addEventListener('orientationchange', 다시그리기예약);

/* ── 내 필기 ── */
function 필기모음() {
  const 모음 = new Map();
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i) || '';
    if (k.indexOf('필기:') !== 0) continue;
    const j = k.lastIndexOf(':');
    if (j <= 2) continue;
    const 파일 = k.slice(3, j), 쪽번호 = parseInt(k.slice(j + 1), 10);
    let 획 = [];
    try { 획 = JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) {}
    if (!획.length || !isFinite(쪽번호)) continue;
    if (!모음.has(파일)) 모음.set(파일, []);
    모음.get(파일).push(쪽번호);
  }
  모음.forEach(v => v.sort((a, b) => a - b));
  return 모음;
}

function 필기그리기() {
  const 칸 = $('#필기자리');
  칸.innerHTML = '';
  const 모음 = 필기모음();
  if (!모음.size) {
    칸.innerHTML = '<div class="빈">아직 필기한 자료가 없습니다.<br>수업 자료를 열고 [필기 끔]을 눌러 보세요.</div>';
    return;
  }
  모음.forEach((쪽들, 파일) => {
    const 찾음 = 자료색인.get(파일);
    const 자 = 찾음 ? 찾음.자 : { 제목: 파일.split('/').pop(), 파일 };

    const 줄 = document.createElement('div');
    줄.className = '필기줄';
    const 열 = document.createElement('button');
    열.className = '글';
    열.innerHTML = '<b></b><i></i>';
    열.querySelector('b').textContent = 자.제목 || '수업 자료';
    열.querySelector('i').textContent =
      (찾음 ? 찾음.위치 + ' · ' : '') + '필기 ' + 쪽들.length + '쪽 (' + 쪽들.join(', ') + '쪽)';
    열.onclick = () => 뷰어열기(자, 쪽들[0]);
    줄.appendChild(열);

    const 지 = document.createElement('button');
    지.className = '지움';
    지.textContent = '✕';
    지.setAttribute('aria-label', '이 자료의 필기 지우기');
    지.onclick = () => {
      if (!confirm('이 자료의 필기를 모두 지울까요?')) return;
      쪽들.forEach(p => { try { localStorage.removeItem('필기:' + 파일 + ':' + p); } catch (e) {} });
      필기그리기();
      탭표시();
    };
    줄.appendChild(지);
    칸.appendChild(줄);
  });
}

/* ── 아래 메뉴바 ── */
let 지금화면 = '수업';
const 탭들 = document.querySelectorAll('.탭');

function 탭표시() {
  탭들.forEach(t => {
    t.classList.toggle('on', t.dataset.화면 === 지금화면);
    const 옛점 = t.querySelector('.점');
    if (옛점) 옛점.remove();
    const 알림 = t.dataset.화면 === '수업' && 새공지().length && 지금화면 !== '수업';
    if (알림) {
      const 점 = document.createElement('span');
      점.className = '점';
      t.appendChild(점);
    }
  });
}

function 화면바꾸기(이름) {
  지금화면 = 이름;
  const 수업중 = 이름 === '수업';
  $('#공지자리').classList.toggle('접힘', !수업중);
  $('#단원자리').classList.toggle('접힘', !수업중);
  $('#필기화면').classList.toggle('접힘', 수업중);
  if (!수업중) 필기그리기();
  탭표시();
  scrollTo({ top: 0 });
}

탭들.forEach(t => { t.onclick = () => 화면바꾸기(t.dataset.화면); });
탭표시();
</script>
</body>
