<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>봉건 사회의 성립 확인 문제</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f7f5f0;color:#23211c;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:oklch(.5 .13 58);text-decoration:none}
button{font-family:inherit;border:none;background:none;padding:0;color:inherit;cursor:pointer}

#퀴즈{max-width:560px;margin:0 auto;padding:20px 16px 60px}

.뒤로{font:500 12.5px/1 'Noto Sans KR';color:#8b8578;display:inline-flex;align-items:center;gap:3px}
.뒤로:hover{color:oklch(.5 .13 58)}

.머리{padding:12px 2px 18px;border-bottom:1px solid #eae5da;margin-bottom:18px}
.제목{font:800 24px/1.3 'Nanum Myeongjo',serif}
.안내{font:400 13px/1.6 'Noto Sans KR';color:#8b8578;margin-top:8px}

.상태바{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fffefb;border:1px solid #e6e1d6;border-radius:14px;padding:12px 16px;margin-bottom:18px}
.요약{font:500 13px/1 'Noto Sans KR';color:#57534a}
.요약 b{color:oklch(.5 .13 58)}
.상태버튼들{display:flex;gap:8px}
.다시버튼{font:500 12.5px/1 'Noto Sans KR';border:1.5px solid #23211c;color:#23211c;border-radius:20px;padding:9px 14px}
.더버튼{font:500 12.5px/1 'Noto Sans KR';border:1.5px solid oklch(.58 .13 58);color:oklch(.5 .13 58);border-radius:20px;padding:9px 14px}
.다시버튼[hidden],.더버튼[hidden]{display:none}

.문제카드{background:#fffefb;border:1px solid #e6e1d6;border-radius:16px;padding:18px 16px;margin-bottom:16px}

.문제머리{display:flex;align-items:flex-start;gap:10px}
.번호{flex:none;width:27px;height:27px;border-radius:50%;background:#23211c;color:#f7f5f0;display:flex;align-items:center;justify-content:center;font:700 12.5px/1 'Nanum Myeongjo',serif;margin-top:1px}
.지문{flex:1;font:500 15px/1.55 'Noto Sans KR';padding-top:2px}

.제출버튼{display:none;flex:none;opacity:0;transform:scale(.7);transition:opacity .16s,transform .16s;background:oklch(.58 .13 58);color:#fffefb;font:700 12px/1 'Noto Sans KR';border-radius:20px;padding:8px 13px;margin-top:1px}
.제출버튼.표시{display:inline-flex}
.제출버튼.보임{opacity:1;transform:scale(1)}
.제출버튼:hover{background:oklch(.52 .13 58)}

.설명박스{background:#faf7f0;border:1px solid #eae5da;border-radius:10px;padding:12px 14px;margin:12px 0 0;font:400 13.5px/1.65 'Noto Sans KR';color:#3c3a34}
.설명박스 p{margin:0}
.설명박스 p+p{margin-top:8px}

.지도래퍼{border:1px solid #e6e1d6;border-radius:12px;overflow:hidden;background:#fffefb;padding:10px;margin:12px 0 0}
.지도목록{display:grid;gap:8px}
.지도목록.칸1{grid-template-columns:1fr}
.지도목록.칸2{grid-template-columns:repeat(2,1fr)}
.지도목록 figure{margin:0}
.지도목록 img{width:100%;height:auto;display:block;border-radius:6px;border:1px solid #eae5da}
.지도목록 figcaption{text-align:center;font:700 11.5px/1 'Noto Sans KR';color:#8b8578;padding-top:6px}

.보기목록{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}
.보기{position:relative;display:flex;align-items:center;gap:11px;padding:11px 13px;border:1.5px solid #e6e1d6;border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.보기:hover{border-color:#cfc7b4}
.보기입력{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.보기:focus-within{outline:2px solid oklch(.58 .13 58);outline-offset:2px}
.보기마커{flex:none;font:700 13.5px/1 'Nanum Myeongjo',serif;color:#8b8578;width:18px}
.보기글{flex:1;font:400 14px/1.5 'Noto Sans KR'}
.보기.선택됨{border-color:oklch(.58 .13 58);background:oklch(.97 .025 78)}
.보기.선택됨 .보기마커{color:oklch(.5 .13 58)}
.보기.정답{border-color:oklch(.55 .12 152);background:oklch(.96 .035 152)}
.보기.정답::after{content:'✓';margin-left:auto;padding-left:8px;font:800 14px/1 'Noto Sans KR';color:oklch(.42 .13 152)}
.보기.오답선택{border-color:#b0503a;background:#fbece6}
.보기.오답선택::after{content:'✕';margin-left:auto;padding-left:8px;font:800 14px/1 'Noto Sans KR';color:#b0503a}
.보기목록.잠김{pointer-events:none}

.결과영역{margin:14px 0 0;padding-top:14px;border-top:1px dashed #e6e1d6}
.결과배지{display:inline-block;font:700 11px/1 'Noto Sans KR';padding:6px 11px;border-radius:20px;margin-bottom:10px}
.결과배지.맞음{background:oklch(.94 .045 152);color:oklch(.38 .12 152)}
.결과배지.틀림{background:#fbeae6;color:#a83a2e}
.정답줄{font:500 13.5px/1.5 'Noto Sans KR';margin:0 0 10px;color:#3c3a34}
.해설{font:400 13.5px/1.75 'Noto Sans KR';color:#57534a;background:#faf8f3;border-radius:10px;padding:12px 14px}
.해설 b{display:block;color:#23211c;font-weight:700;margin-bottom:5px;font-size:12px;letter-spacing:.02em}

@media (min-width:760px){
  #퀴즈{max-width:780px;padding:30px 26px 70px}
  .제목{font-size:30px}
  .안내{font-size:14.5px}
  .문제카드{padding:24px 24px}
  .번호{width:30px;height:30px;font-size:14px}
  .지문{font-size:16.5px}
  .설명박스,.지도래퍼,.보기목록,.결과영역{margin-left:41px}
  .지도목록.칸2{grid-template-columns:repeat(4,1fr)}
  .보기글{font-size:15px}
  .해설{font-size:14.5px}
}
</style>
</head>
<body>

<div id="퀴즈">
  <a class="뒤로" href="../index.html">‹ 자료실로</a>
  <div class="머리">
    <div class="제목">③ 봉건 사회의 성립 · 확인 문제</div>
    <div class="안내">답을 고르면 번호 왼쪽에 제출 버튼이 나타나고, 제출하면 정답과 해설을 볼 수 있어요.</div>
  </div>

  <div class="상태바">
    <span class="요약" id="요약">제출 0 / 5</span>
    <div class="상태버튼들">
      <button class="다시버튼" id="다시풀기" hidden>다시 풀기</button>
      <button class="더버튼" id="문제더풀기" hidden>문제 더 풀기</button>
    </div>
  </div>

  <div id="문제목록"></div>
</div>

<script>
const 동그라미 = ['①','②','③','④','⑤','⑥'];

const 문제전체 = [
  {
    지문: "다음은 중세 농노의 가상 일기이다. ㉠~㉤ 중 적절하지 않은 내용은?",
    설명박스: ["오늘도 힘든 하루였다. 부인과 함께 ㉠ 영주의 땅을 하루 종일 경작해야 했다. 아이들은 염소와 양을 돌봤다. 밀을 빻으려 ㉡ 방앗간에 갔는데 이용료가 너무 비싸 한숨이 나왔다. 아무리 ㉢ 재산을 가질 수 있다고 해도 영주에게 바치는 세금과 시설물 이용료로 다 나가니 힘들다. 내년에는 ㉣ 큰아들이 결혼을 해서 돈이 더 필요한데 걱정이다. 옆 영지는 세금이 우리 영지보다 낮다고 하는데 ㉤ 옆의 영지로 이사를 가야겠다."],
    지도: [{ 파일: "img/02-04-01-serf-diary.png" }],
    보기: [
      "㉠ 영주의 땅을 경작하였다.",
      "㉡ 방앗간 이용료를 냈다.",
      "㉢ 재산을 가질 수 있었다.",
      "㉣ 큰아들의 결혼을 준비하였다.",
      "㉤ 세금이 낮은 옆 영지로 이사하였다."
    ],
    정답: 4,
    해설: "중세 서유럽 장원의 농민은 대부분 농노였다. 농노는 영주에게 시설물에 대한 사용료를 비롯한 각종 세금을 바쳐야 했고, 영주의 땅을 경작해야 했다. 다만 노예와 달리 결혼하여 가정을 꾸릴 수 있었고, 집과 토지 등 약간의 재산을 소유할 수 있었다. ㉤ 농노는 영주에게 예속되어 마음대로 이사할 수 없었다."
  },
  {
    지문: "그림은 중세 서유럽의 장원을 보여 준다. 이에 대한 학생들의 대화 내용으로 적절하지 않은 것은?",
    지도: [{ 파일: "img/02-04-01-manor.png" }],
    보기: [
      "농노는 영주의 땅을 경작하였어.",
      "자급자족을 하는 농촌 공동체였어.",
      "사람들은 교회가 정한 달력에 맞추어 일하였어.",
      "영주는 재판을 진행할 때 주군의 간섭을 받았어.",
      "농노는 방앗간, 대장간 등의 시설물을 이용하고 영주에게 사용료를 냈지."
    ],
    정답: 3,
    해설: "중세 서유럽의 장원은 자급자족의 농촌 공동체였다. 농노들은 영주의 땅을 경작해야 했으며, 방앗간, 대장간 등의 시설물을 사용하고 영주에게 이에 대한 사용료를 지불하였다. 한편, 이 시기 사람들은 교회에서 정한 달력에 맞추어 일하였다. ④ 영주는 주군의 간섭 없이 장원을 다스리며 재판을 하였다."
  },
  {
    지문: "다음은 중세 농노의 생활 모습을 묘사한 글이다. 이를 바탕으로 중세 농노에 대해 옳게 설명한 것은?",
    설명박스: ["나는 아내와 세 자녀를 데리고 작은 오두막에 산다. 집터와 목초지, 그리고 약간의 포도나무가 있는 땅을 영주에게서 빌려 쓰고 있다. 1주일의 3일은 내 땅을 경작하고, 일요일은 교회에 나가며, 나머지 3일은 영주가 직접 경영하는 땅에서 일을 해야 한다."],
    보기: [
      "가족을 갖는 것이 허락되지 않았다.",
      "고대 노예와 자영농의 중간적 신분에 해당되었다.",
      "영주의 허락 없이도 다른 장원으로 이주할 수 있었다.",
      "방앗간, 제분소와 같은 공동 시설물은 무료로 이용하였다.",
      "개인적으로 땅을 소유할 수 없었기 때문에 영주의 직영지를 경작하였다."
    ],
    정답: 1,
    해설: "중세의 농노는 고대 노예와 달리 자신의 집과 토지를 소유할 수 있었으나, 거주 이전의 자유나 직업 선택의 자유는 없었다. 또한 영주의 보호 아래 생명을 유지하고 그의 집을 빌려서 생활하였기 때문에 영주에게 예속되어 각종 의무를 이행해야 했다."
  },
  {
    지문: "중세 서유럽 봉건 제도의 특징을 <보기>에서 고른 것은?",
    설명박스: [
      "ㄱ. 자급자족적인 장원 경제 체제",
      "ㄴ. 주군과 봉신 간의 쌍무적 계약 관계",
      "ㄷ. 노예 노동을 기반으로 한 경제 체제",
      "ㄹ. 봉토와 충성의 의무를 매개로 한 주종 관계",
      "ㅁ. 강력한 왕권을 바탕으로 한 중앙 집권 체제"
    ],
    보기: ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ, ㅁ", "ㄴ, ㄷ, ㅁ", "ㄷ, ㄹ, ㅁ"],
    정답: 0,
    해설: "중세 사회는 정치적으로는 지방 분권, 군사적으로는 주종 관계(쌍무적 계약 관계), 경제적으로는 자급자족의 장원 경제, 종교적으로 크리스트교적인 통일 세계이다."
  },
  {
    지문: "다음은 중세 봉건 사회의 구조이다. (가), (나) 계급에 대한 설명으로 옳은 것은?",
    지도: [{ 파일: "img/02-04-01-feudal-diagram.png" }],
    보기: [
      "(가)는 (나)에게 세금을 부과하였다.",
      "(나)는 거주 이전의 자유가 없었다.",
      "(나)는 장원에서 노동에 종사하였다.",
      "(가)와 (나)는 쌍무적 계약 관계를 형성하였다.",
      "(가)와 (나)는 신분적으로 지배와 피지배 관계에 놓였다."
    ],
    정답: 3,
    해설: "(가)는 제후(주군), (나)는 기사(봉신)이다. 기사들은 자신보다 세력이 강한 기사를 주군으로 삼았고, 주군은 충성과 봉사를 서약한 기사에게 토지(봉토)를 주어 봉신으로 삼았다. 이러한 주종 관계는 어느 한쪽이 의무를 다하지 않으면 언제든지 파기될 수 있는 쌍무적 계약 관계였다. ① 세금을 납부한 계층은 농노였다. ②, ③ 농노에 대한 설명이다. ⑤ 영주와 농노의 관계에 대한 설명이다."
  }
];

function 셔플(원본배열) {
  const a = 원본배열.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let 문제풀 = [];
let 표시개수 = 0;
let 제출됨 = [];
let 정답수 = 0;

function 문제카드만들기(문제, idx) {
  const 다중 = Array.isArray(문제.정답);
  const 카드 = document.createElement('div');
  카드.className = '문제카드';

  const 머리 = document.createElement('div');
  머리.className = '문제머리';

  const 제출버튼 = document.createElement('button');
  제출버튼.className = '제출버튼';
  제출버튼.type = 'button';
  제출버튼.textContent = '제출';

  const 번호 = document.createElement('span');
  번호.className = '번호';
  번호.textContent = idx + 1;

  const 지문 = document.createElement('div');
  지문.className = '지문';
  지문.textContent = 문제.지문;

  머리.append(제출버튼, 번호, 지문);
  카드.appendChild(머리);

  if (문제.설명박스) {
    const 박스 = document.createElement('div');
    박스.className = '설명박스';
    문제.설명박스.forEach(줄 => {
      const p = document.createElement('p');
      p.textContent = 줄;
      박스.appendChild(p);
    });
    카드.appendChild(박스);
  }

  if (문제.지도 && 문제.지도.length) {
    const 지도칸 = document.createElement('div');
    지도칸.className = '지도래퍼';
    const 목록 = document.createElement('div');
    목록.className = '지도목록 ' + (문제.지도.length > 1 ? '칸2' : '칸1');
    문제.지도.forEach(m => {
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = m.파일;
      img.alt = m.라벨 ? m.라벨 + ' 자료' : '참고 자료';
      img.loading = 'lazy';
      fig.appendChild(img);
      if (m.라벨) {
        const cap = document.createElement('figcaption');
        cap.textContent = m.라벨;
        fig.appendChild(cap);
      }
      목록.appendChild(fig);
    });
    지도칸.appendChild(목록);
    카드.appendChild(지도칸);
  }

  const 보기목록 = document.createElement('div');
  보기목록.className = '보기목록';
  const 보기라벨들 = [];

  문제.보기.forEach((글, i) => {
    const 라벨 = document.createElement('label');
    라벨.className = '보기';

    const 입력 = document.createElement('input');
    입력.type = 다중 ? 'checkbox' : 'radio';
    입력.name = '문제' + idx;
    입력.value = i;
    입력.className = '보기입력';

    const 마커 = document.createElement('span');
    마커.className = '보기마커';
    마커.textContent = 동그라미[i];

    const 글칸 = document.createElement('span');
    글칸.className = '보기글';
    글칸.textContent = 글;

    라벨.append(입력, 마커, 글칸);
    보기목록.appendChild(라벨);
    보기라벨들.push(라벨);

    입력.addEventListener('change', () => {
      if (다중) {
        라벨.classList.toggle('선택됨', 입력.checked);
      } else {
        보기라벨들.forEach(l => l.classList.remove('선택됨'));
        라벨.classList.add('선택됨');
      }
      const 선택있음 = 보기라벨들.some(l => l.querySelector('input').checked);
      제출버튼.classList.toggle('표시', 선택있음);
      if (선택있음) requestAnimationFrame(() => 제출버튼.classList.add('보임'));
    });
  });
  카드.appendChild(보기목록);

  const 결과 = document.createElement('div');
  결과.className = '결과영역';
  결과.hidden = true;

  const 배지 = document.createElement('span');
  배지.className = '결과배지';

  const 정답줄 = document.createElement('p');
  정답줄.className = '정답줄';

  const 해설칸 = document.createElement('div');
  해설칸.className = '해설';
  const 해설제목 = document.createElement('b');
  해설제목.textContent = '해설';
  const 해설글 = document.createElement('p');
  해설글.textContent = 문제.해설;
  해설글.style.margin = '0';
  해설칸.append(해설제목, 해설글);

  결과.append(배지, 정답줄, 해설칸);
  카드.appendChild(결과);

  제출버튼.addEventListener('click', () => {
    const 고른것 = [];
    보기라벨들.forEach((l, i) => { if (l.querySelector('input').checked) 고른것.push(i); });
    if (!고른것.length) return;

    const 정답목록 = (다중 ? 문제.정답.slice() : [문제.정답]).sort((a, b) => a - b);
    고른것.sort((a, b) => a - b);
    const 맞음 = 정답목록.length === 고른것.length && 정답목록.every((v, i) => v === 고른것[i]);

    보기라벨들.forEach((l, i) => {
      l.querySelector('input').disabled = true;
      if (정답목록.includes(i)) l.classList.add('정답');
      else if (고른것.includes(i)) l.classList.add('오답선택');
    });
    보기목록.classList.add('잠김');

    배지.textContent = 맞음 ? '정답이에요' : '아쉬워요, 오답이에요';
    배지.className = '결과배지 ' + (맞음 ? '맞음' : '틀림');
    정답줄.innerHTML = '정답은 ' + 정답목록.map(v => '<b>' + 동그라미[v] + '번</b>').join(', ') + '이에요.';
    결과.hidden = false;
    제출버튼.remove();

    if (!제출됨[idx]) {
      제출됨[idx] = true;
      if (맞음) 정답수++;
      요약갱신();
    }
  });

  return 카드;
}

function 문제풀기시작() {
  문제풀 = 셔플(문제전체);
  표시개수 = Math.min(5, 문제풀.length);
  제출됨 = new Array(표시개수).fill(false);
  정답수 = 0;

  const 목록칸 = document.getElementById('문제목록');
  목록칸.innerHTML = '';
  for (let i = 0; i < 표시개수; i++) 목록칸.appendChild(문제카드만들기(문제풀[i], i));
  요약갱신();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function 문제더풀기() {
  const 새표시개수 = Math.min(표시개수 + 5, 문제풀.length);
  const 목록칸 = document.getElementById('문제목록');
  for (let i = 표시개수; i < 새표시개수; i++) {
    제출됨.push(false);
    목록칸.appendChild(문제카드만들기(문제풀[i], i));
  }
  표시개수 = 새표시개수;
  요약갱신();
}

function 요약갱신() {
  const 제출수 = 제출됨.filter(Boolean).length;
  document.getElementById('요약').innerHTML = '제출 <b>' + 제출수 + '</b> / ' + 표시개수 +
    (제출수 ? '  ·  정답 <b>' + 정답수 + '</b>개' : '');
  document.getElementById('다시풀기').hidden = 제출수 === 0;
  document.getElementById('문제더풀기').hidden = !(제출수 === 표시개수 && 표시개수 < 문제풀.length);
}

document.getElementById('다시풀기').onclick = 문제풀기시작;
document.getElementById('문제더풀기').onclick = 문제더풀기;

문제풀기시작();
</script>
</body>
</html>
